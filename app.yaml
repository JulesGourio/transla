command: [
  "bash", "start.sh"
]
env:
  # Application version — increment to invalidate any cached behavior
  - name: APP_VERSION
    value: "1.0.0"

  # Lakebase — reuses an existing shared Postgres project id ("qualibot") to
  # avoid provisioning new compute, but with this app's own dedicated
  # database: latlang is the real data, latlang_test a disposable
  # validation copy.
  - name: LAKEBASE_PROJECT_ID
    value: "qualibot"
  - name: LAKEBASE_DATABASE
    value: "latlang"

  # LLM endpoint for both the Q&A and batched segment-translation calls
  # (server/services/llm.py::call_llm_json). Falls back to a hardcoded
  # default in code when unset — set explicitly once a target endpoint is
  # confirmed for this app's own Model Serving usage.
  - name: TRANSLATE_ENDPOINT
    value: "databricks-gpt-5-6-luna"

  # Offline glossary-mining endpoint (utils/glossary/*.py) — cheaper batch
  # mining, matches the hardcoded default already used by those scripts.
  - name: GLOSSARY_EXTRACT_ENDPOINT
    value: "databricks-gpt-5-4-mini"

  # Per-environment volume path for job input/output .docx files. Absence
  # disables rebuild/validate/preview (gracefully handled).
  #   uat : /Volumes/uat_landingzone/latlang/latlang
  #   prod: /Volumes/prod_landingzone/latlang/latlang
  - name: TRANSLATE_VOLUME_PATH
    value: "/Volumes/uat_proj/latlang/latlang"

  # Max concurrent batched-translation LLM calls per job
  - name: TRANSLATE_MAX_CONCURRENT
    value: "3"

  # Exact-layout PDF preview engine (server/services/soffice.py) — this app's
  # own LibreOffice archive/volume, standalone.
  - name: SOFFICE_ARCHIVE_VOLUME_PATH
    value: ""
  # Local-dev escape hatch: absolute path to an existing soffice binary.
  - name: SOFFICE_PATH
    value: ""
