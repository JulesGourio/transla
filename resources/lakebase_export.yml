# Lakebase Copy Job — Lakebase (Postgres) tables -> Unity Catalog Delta tables
#
# Copies every table of a Lakebase database into a Unity Catalog schema, directly (no volume, no
# intermediate file): tables and columns are discovered at each run, Delta types are derived from the
# Postgres types, and each target table is created when missing and fully replaced otherwise
# (CREATE OR REPLACE, atomic, Delta history kept). All tables are read from one consistent snapshot.
#
# Notebook: utils/lakebase_sync/Copy_Lakebase_To_UC.py
#   base_parameters (everything is generic; point them to any Lakebase / any target):
#     lakebase_project / lakebase_branch / lakebase_endpoint   Lakebase Autoscaling source
#     lakebase_instance                                         Lakebase Provisioned source (instead of project)
#     lakebase_database                                         Postgres database
#     source_schemas / include_tables / skip_tables             selection (empty = everything)
#     target_catalog / target_schema / create_target_schema     Unity Catalog destination
#     target_table_name                                         name pattern, e.g. "{table}" or "{schema}_{table}"
#
# Requirements:
#   - Serverless only: classic job clusters cannot reach the Lakebase private endpoint in this workspace.
#   - The run_as service principal needs a Postgres role on the Lakebase database with SELECT on the
#     source tables, and must own the target tables that already exist (CREATE OR REPLACE).

targets:
  qualibot-uat:
    resources:
      jobs:
        lakebase_copy:
          name: "D_1_latlang-lakebase-copy-${bundle.target}"
          description: "Copy of every Lakebase table into Unity Catalog Delta tables (tables created if missing)"

          # Two overlapping runs would replace the same tables concurrently.
          max_concurrent_runs: 1

          tags:
            project: Latlang
            activity-type: ${var.parsing_job_activity_tag}
            job-purpose: lakebase-copy

          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE

          # Same identity as the other jobs of this target (job-runner-sa-uat).
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39

          tasks:
            - task_key: "1_copy_lakebase_tables"
              description: "Discover the Lakebase tables, then create or replace each one in Unity Catalog"
              timeout_seconds: 3600
              environment_key: lakebase_copy_env
              notebook_task:
                notebook_path: ../utils/export_lakebase/create_proj_latlang_tables.py
                source: WORKSPACE
                base_parameters:
                  # Source: Lakebase Autoscaling project. For a Provisioned instance, empty the project
                  # and set lakebase_instance instead.
                  lakebase_project: "qualibot"
                  lakebase_branch: "production"
                  lakebase_endpoint: "primary"
                  lakebase_instance: ""
                  lakebase_host: ""
                  lakebase_database: "latlang"
                  # Selection: empty = every non-system schema / every table.
                  source_schemas: ""
                  include_tables: ""
                  skip_tables: ""
                  # Destination
                  target_catalog: "uat_proj"
                  target_schema: "latlang"
                  create_target_schema: "false"
                  target_table_name: "{table}"
                  fetch_batch_rows: "20000"
              # databricks-sdk is checked (and only upgraded if older than 0.102) by the notebook's first
              # cell, with the runtime's other packages pinned.

          environments:
            - environment_key: lakebase_copy_env
              spec:
                environment_version: "5"
                dependencies:
                  - psycopg2-binary>=2.9

          # Daily refresh. Left PAUSED until a first manual run is validated.
          schedule:
            quartz_cron_expression: "0 0 2 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: PAUSED