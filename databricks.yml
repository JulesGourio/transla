# Databricks Asset Bundle (DABs) — LatLang
#
# Fully standalone app: own bundle, own catalog schema/volume, own
# Databricks App / service principal / permissions group. The Lakebase
# Postgres project id (see app.yaml's LAKEBASE_PROJECT_ID) reuses an
# existing shared Postgres compute resource to avoid provisioning a new
# one — this app owns its own dedicated database inside it, nothing else
# is shared.

bundle:
  name: latlang

variables:
  app_name:
    default: "latlang"
    description: "Unique name for the Databricks App"
  
  # --- Variables centralisées sur le catalogue Proj ---
  app_write_catalog:
    description: The write catalog
    default: dev_proj
  app_write_schema:
    description: The write schema
    default: latlang
  app_volume_name:
    description: "Name of the main storage volume"
    default: latlang

  # Databricks group with access to this app. TODO: swap this for a
  # dedicated "Role-Project-LEAP-End-users-LatLang" group once created —
  # temporarily reusing the sibling Qualibot/DocCompare app's end-users
  # group (2026-08-24) so real end users can be granted CAN_USE now.
  end_users_group:
    default: "Role-Project-LEAP-End-users-Qualibot-DocCompare"

sync:
  include:
    - "target_config.env"
    - "client/out/**"
  exclude:
    - "~$*"
    - "client/src/**"
    - "client/public/**"
    - "client/node_modules/**"
    - ".git/**"
    - ".databricks/**"
    - "__pycache__/**"
    - "**/*.pyc"
    - ".venv/**"
    - "**/*.ipynb"

resources:
  apps:
    latlang:
      name: ${var.app_name}
      description: "LatLang — bilingual .docx translation pipeline for aerospace documentation"
      source_code_path: .
      permissions:
        - group_name: "Role-Project-LEAP-CoreAdmin"
          level: CAN_MANAGE
        - group_name: "Role-Project-LEAP-CoreDev"
          level: CAN_MANAGE
        - group_name: ${var.end_users_group}
          level: CAN_USE
        # job-runner-sa-uat: needs CAN_MANAGE to start/stop the app from the
        # start_app/stop_app schedule jobs (latlang-uat target only).
        - service_principal_name: "3e5cd4e5-f765-4760-b974-ee7715258b39"
          level: CAN_MANAGE

targets:
  dev:
    workspace:
      host: https://dbc-c623749d-731b.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      schemas:
        latlang_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        latlang_volume:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.latlang_schema.name}
          name: ${var.app_volume_name}
          volume_type: MANAGED
    variables:
      app_write_catalog: dev_proj
      app_write_schema: latlang

  latlang-uat:
    default: true
    workspace:
      host: https://dbc-3a17bfce-9e88.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      schemas:
        latlang_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        latlang_volume:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.latlang_schema.name}
          name: ${var.app_volume_name}
          volume_type: MANAGED
      jobs:
        grant_volume_access:
          name: "latlang-grant-volume-access-${bundle.target}"
          description: "Grants USE CATALOG + USE SCHEMA + WRITE VOLUME on the latlang volume to a service principal (the app's own, after first creation). Manual trigger only."
          max_concurrent_runs: 1
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          parameters:
            - name: service_principal
              default: ""
            - name: catalog
              default: ${var.app_write_catalog}
            - name: schema_name
              default: ${var.app_write_schema}
            - name: volume_name
              default: ${var.app_volume_name}
            - name: volume_permission
              default: "WRITE VOLUME"
          tasks:
            - task_key: grant
              notebook_task:
                notebook_path: ./utils/databricks_ops/grant_volume_access_job.py
                source: WORKSPACE
                base_parameters:
                  service_principal: "{{job.parameters.service_principal}}"
                  catalog: "{{job.parameters.catalog}}"
                  schema_name: "{{job.parameters.schema_name}}"
                  volume_name: "{{job.parameters.volume_name}}"
                  volume_permission: "{{job.parameters.volume_permission}}"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
        # Export this app's own Lakebase database to a UC staging volume.
        # Serverless compute: classic job clusters can't reach the Lakebase
        # private endpoint from this workspace.
        lakebase_export_uat_to_volume:
          name: "latlang-lakebase-export-uat-to-volume-${bundle.target}"
          description: "Export Lakebase latlang tables to a Unity Catalog staging volume"
          max_concurrent_runs: 1
          tasks:
            - task_key: export_lakebase_uat_to_volume
              notebook_task:
                notebook_path: ./utils/databricks_ops/lakebase_sync/export_lakebase_uat_to_volume_job.py
                source: WORKSPACE
                base_parameters:
                  LAKEBASE_PROJECT_ID: "qualibot"
                  LAKEBASE_BRANCH: "production"
                  LAKEBASE_ENDPOINT: "primary"
                  LAKEBASE_DATABASE: "latlang"
                  OUTPUT_VOLUME_CATALOG: "uat_proj"
                  OUTPUT_VOLUME_SCHEMA: "latlang"
                  OUTPUT_VOLUME_NAME: "latlang"
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - psycopg2-binary
                  - databricks-sdk>=0.118.0
        # Weekday-only start/stop schedule — app stays RUNNING only 8h-19h
        # Europe/Paris, Mon-Fri, to save cost outside business hours. Never
        # deployed to dev (dev app is intentionally left off) or prod (not
        # requested).
        start_app:
          name: "WD_0_latlang_start_app_${bundle.target}"
          description: "Starts the latlang app every weekday morning."
          max_concurrent_runs: 1
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          schedule:
            quartz_cron_expression: "0 0 8 ? * MON-FRI"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED
          tasks:
            - task_key: start_app
              notebook_task:
                notebook_path: ./utils/databricks_ops/app_lifecycle_job.py
                source: WORKSPACE
                base_parameters:
                  app_name: ${var.app_name}
                  action: start
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
        stop_app:
          name: "WD_1_latlang_stop_app_${bundle.target}"
          description: "Stops the latlang app every weekday evening."
          max_concurrent_runs: 1
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39
          schedule:
            quartz_cron_expression: "0 0 19 ? * MON-FRI"
            timezone_id: "Europe/Paris"
            pause_status: UNPAUSED
          tasks:
            - task_key: stop_app
              notebook_task:
                notebook_path: ./utils/databricks_ops/app_lifecycle_job.py
                source: WORKSPACE
                base_parameters:
                  app_name: ${var.app_name}
                  action: stop
              environment_key: default
          environments:
            - environment_key: default
              spec:
                environment_version: "2"
                dependencies:
                  - databricks-sdk>=0.118.0
    variables:
      app_name: "latlang"
      app_write_catalog: uat_proj
      app_write_schema: latlang
      app_volume_name: latlang

  latlang-prod:
    mode: production
    workspace:
      host: ""
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      schemas:
        latlang_schema:
          catalog_name: ${var.app_write_catalog}
          name: ${var.app_write_schema}
      volumes:
        latlang_volume:
          catalog_name: ${var.app_write_catalog}
          schema_name: ${resources.schemas.latlang_schema.name}
          name: ${var.app_volume_name}
          volume_type: MANAGED
      apps:
        latlang:
          resources:
            - name: latlang-volume
              uc_securable:
                securable_type: VOLUME
                securable_full_name: prod_proj.latlang.latlang
                permission: WRITE_VOLUME
    variables:
      app_name: "latlang"
      app_write_catalog: prod_proj
      app_write_schema: latlang
      app_volume_name: latlang