[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]
exclude = ["client*", "tests*"]

[project]
name = "latlang"
version = "1.0.0"
description = "Bilingual .docx translation pipeline for aerospace documentation"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115.8",
  "python-dotenv>=1.0.1",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "databricks-sdk>=0.88.0",
  "asyncpg>=0.29.0",
  "pymupdf>=1.25.0",
  "pillow>=11.0.0",
  "lxml>=5.0.0",
  "fasttext-wheel>=0.9.2",  # local language-ID pre-check (server/data/lid.176.ftz)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
